name: bale-auto

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.7.1-2-slim
    container_name: bale-auto-openclaw
    env_file:
      - path: .env
        required: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: Asia/Tehran
    volumes:
      - ./state:/home/node/.openclaw
      - ./auth-profile-secrets:/home/node/.config/openclaw
    ports:
      - 127.0.0.1:18789:18789
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.7.1-2-slim
    profiles: [cli]
    env_file:
      - path: .env
        required: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      BROWSER: echo
      TZ: Asia/Tehran
    volumes:
      - ./state:/home/node/.openclaw
      - ./auth-profile-secrets:/home/node/.config/openclaw
    network_mode: service:openclaw-gateway
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint: [node, dist/index.js]
    depends_on:
      openclaw-gateway:
        condition: service_healthy
