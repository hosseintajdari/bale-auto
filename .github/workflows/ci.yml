name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e . || echo "Editable install skipped"
          fi
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q .
          if [ -f pyproject.toml ] && grep -q '\[tool\.ruff' pyproject.toml; then
            pip install ruff
            if grep -q '\[tool\.ruff\.lint' pyproject.toml; then
              ruff check .
            else
              ruff check --select=E9,F63,F7,F82 .
            fi
          elif [ -f .flake8 ] || [ -f setup.cfg ]; then
            pip install flake8
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          fi

      - name: Run tests with pytest
        run: |
          if [ -d "tests" ] || [ -d "test" ]; then
            PYTHONPATH=. pytest -v
          else
            echo "No test directory found; skipping pytest."
          fi
